[package]
name = "rip_v2"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
flexi_logger = "0.31"
ipnetwork = "0.21.1"
libc = "0.2.186"
log = "0.4.27"
rtnetlink = "0.21.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.27"
serde_json = "1"
socket2 = "0.6.4"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
