<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIP Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">rip_v2</p>
        <h1>Routing Table</h1>
      </div>
      <div class="status" id="status">Loading</div>
    </header>

    <main>
      <section class="form-shell">
        <div class="section-header">
          <h2>Add Local Network</h2>
          <div class="status" id="local-route-status">Ready</div>
        </div>
        <form id="local-route-form" class="local-route-form">
          <label>
            Address
            <input
              id="local-route-address"
              name="address"
              type="text"
              inputmode="decimal"
              placeholder="10.4.4.0"
              required
            />
          </label>
          <label>
            Prefix
            <input
              id="local-route-prefix"
              name="prefix"
              type="number"
              min="0"
              max="32"
              value="24"
              required
            />
          </label>
          <label>
            Device
            <input
              id="local-route-dev"
              name="dev"
              type="text"
              placeholder="lan1"
              required
            />
          </label>
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="table-shell">
        <table>
          <thead>
            <tr>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="destination">
                  Destination<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="next_hop">
                  Next hop<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="metric">
                  Metric<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="interface_name">
                  Interface<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="route_type">
                  Type<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="state">
                  State<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="in_kernel">
                  Kernel<span class="sort-indicator"></span>
                </button>
              </th>
              <th aria-sort="none">
                <button class="sort-button" type="button" data-sort-key="timeout_seconds">
                  Timeout<span class="sort-indicator"></span>
                </button>
              </th>
            </tr>
          </thead>
          <tbody id="routes-body">
            <tr>
              <td colspan="8" class="empty">Loading routes</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="logs-shell">
        <div class="section-header">
          <h2>Daemon Logs</h2>
          <div class="status" id="logs-status">Loading</div>
        </div>
        <pre id="logs-output" class="logs-output">Loading logs</pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
