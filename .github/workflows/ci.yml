name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Check integration scripts syntax
        run: bash -n tests/integration/*.sh

      - name: Run unit tests
        run: cargo test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install network test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping

      - name: Run integration scenarios
        run: sudo -E tests/integration/00_all.sh
